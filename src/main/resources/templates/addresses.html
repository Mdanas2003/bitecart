<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My addresses | BiteCart</title><link rel="stylesheet" th:href="@{/css/catalog.css}"><link rel="stylesheet" th:href="@{/css/checkout.css}"></head>
<body><div class="page-shell"><header th:replace="~{fragments/catalog :: header}"></header>
<main class="cart-layout"><div class="section-heading"><div><p class="eyebrow">DELIVERY ADDRESSES</p><h1>My addresses.</h1></div><a class="button" th:href="@{/addresses/new}">Add address</a></div>
<p class="alert success" th:if="${addressSuccess}" th:text="${addressSuccess}" role="status"></p><p class="alert" th:if="${addressError}" th:text="${addressError}" role="alert"></p>
<section class="address-list" th:if="${!addresses.isEmpty()}"><article class="address-card" th:each="address : ${addresses}"><div><div class="address-card-heading"><strong th:text="${address.addressLine1}">Address</strong><span class="featured-tag" th:if="${address.defaultAddress}">Default</span></div><p th:if="${address.addressLine2}" th:text="${address.addressLine2}"></p><p th:text="|${address.city}, ${address.state} ${address.postalCode}|">City</p><p th:text="${address.country}">Country</p><p th:text="${address.phone}">Phone</p></div><div class="address-actions"><a class="secondary-button" th:href="@{/addresses/{id}/edit(id=${address.id})}">Edit</a><form th:if="${!address.defaultAddress}" th:action="@{/addresses/{id}/default(id=${address.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="text-button" type="submit">Set default</button></form><form th:action="@{/addresses/{id}/delete(id=${address.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="text-button" type="submit">Delete</button></form></div></article></section>
<section class="empty-state large-empty" th:if="${addresses.isEmpty()}"><span aria-hidden="true">📍</span><h2>No addresses yet.</h2><p>Add a delivery address to make checkout quick and easy.</p><a class="button" th:href="@{/addresses/new}">Add delivery address</a></section>
</main><footer th:replace="~{fragments/catalog :: footer}"></footer></div></body></html>
