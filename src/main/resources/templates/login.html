<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | BiteCart</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="auth-shell">
    <section class="auth-card" aria-labelledby="login-title">
        <a class="brand" th:href="@{/}">BITE CART</a>
        <h1 id="login-title">Welcome back.</h1>
        <p class="intro">Your cravings are one cart away.</p>

        <p class="alert alert-success" th:if="${param.registered}">Your account is ready. Sign in to continue.</p>
        <p class="alert alert-success" th:if="${param.logout}">You have been signed out.</p>
        <p class="alert alert-error" th:if="${param.error}">Invalid email or password.</p>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="field">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" required autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="button" type="submit">Sign in</button>
        </form>

        <p class="auth-footer">New to BiteCart? <a th:href="@{/register}">Create an account</a></p>
    </section>
</main>
</body>
</html>
