<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Your cart | BiteCart</title><link rel="stylesheet" th:href="@{/css/catalog.css}"></head>
<body><div class="page-shell"><header th:replace="~{fragments/catalog :: header}"></header><main class="cart-layout"><div class="section-heading"><div><p class="eyebrow">YOUR CART</p><h1>Ready when you are.</h1></div><a th:href="@{/products}">Keep browsing →</a></div><p class="alert success" th:if="${cartSuccess}" th:text="${cartSuccess}"></p><p class="alert" th:if="${cartError}" th:text="${cartError}"></p><section th:if="${!cart.items.isEmpty()}" class="cart-content"><div class="cart-items"><article th:each="item : ${cart.items}" class="cart-item"><div class="cart-item-image"><img th:if="${item.imageUrl}" th:src="${item.imageUrl}" th:alt="${item.productName}"><span th:unless="${item.imageUrl}" aria-hidden="true">🍽️</span></div><div class="cart-item-copy"><h2 th:text="${item.productName}">Product</h2><p th:text="|₹${item.unitPrice} each|">₹0 each</p><form th:action="@{/cart/items/{id}(id=${item.id})}" method="post" class="quantity-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label th:for="|quantity-${item.id}|">Quantity</label><input th:id="|quantity-${item.id}|" name="quantity" type="number" min="1" th:value="${item.quantity}" required><button class="secondary-button" type="submit">Update</button></form><form th:action="@{/cart/items/{id}/remove(id=${item.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="text-button" type="submit">Remove</button></form></div><strong th:text="|₹${item.lineTotal}|">₹0</strong></article></div><aside class="cart-summary"><p class="eyebrow">ORDER SUMMARY</p><div><span>Items</span><span th:text="${cart.totalItems}">0</span></div><div class="subtotal"><span>Subtotal</span><strong th:text="|₹${cart.subtotal}|">₹0</strong></div><a class="button" th:href="@{/checkout}">Proceed to checkout</a><form th:action="@{/cart/clear}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="text-button" type="submit">Clear cart</button></form></aside></section><section th:if="${cart.items.isEmpty()}" class="empty-state large-empty"><span aria-hidden="true">🛍️</span><h2>Your cart is waiting.</h2><p>Add something delicious and it will appear here.</p><a class="button" th:href="@{/products}">Browse food</a></section></main></div></body></html>
