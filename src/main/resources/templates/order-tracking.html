<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Track order | BiteCart</title><link rel="stylesheet" th:href="@{/css/catalog.css}"><link rel="stylesheet" th:href="@{/css/checkout.css}"></head>
<body><div class="page-shell"><header th:replace="~{fragments/catalog :: header}"></header><main class="orders-layout"><a class="back-link" th:href="@{/orders/{id}(id=${tracking.orderId})}">← Order details</a><div class="section-heading"><div><p class="eyebrow">ORDER TRACKING</p><h1 th:text="|Order #${tracking.orderId}|">Order</h1><p th:text="|Last updated ${#temporals.format(tracking.updatedAt, 'dd MMM yyyy, hh:mm a')}|">Updated</p></div><span class="status-pill" th:text="${#strings.replace(tracking.orderStatus, '_', ' ')}">PLACED</span></div><section class="tracking-card"><ol class="tracking-steps"><li th:each="step : ${tracking.steps}" th:classappend="${step.completed ? ' is-complete' : ''} + ${step.current ? ' is-current' : ''}"><span class="tracking-dot" aria-hidden="true"></span><div><strong th:text="${step.label}">Order placed</strong><p th:if="${step.current}">Current status</p></div></li></ol></section></main></div></body></html>
