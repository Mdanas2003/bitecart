<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Your orders | BiteCart</title><link rel="stylesheet" th:href="@{/css/catalog.css}"><link rel="stylesheet" th:href="@{/css/checkout.css}"></head>
<body><div class="page-shell"><header th:replace="~{fragments/catalog :: header}"></header><main class="orders-layout"><div class="section-heading"><div><p class="eyebrow">YOUR ORDERS</p><h1>Every craving, remembered.</h1></div><a th:href="@{/products}">Browse food →</a></div><section th:if="${!orders.isEmpty()}" class="order-list"><article th:each="order : ${orders}" class="order-card"><div><h2 th:text="|Order #${order.id}|">Order</h2><p th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, hh:mm a')}">Date</p></div><span class="status-pill" th:text="${#strings.replace(order.orderStatus, '_', ' ')}">PLACED</span><strong th:text="|₹${order.totalAmount}|">₹0</strong><a class="secondary-button" th:href="@{/orders/{id}(id=${order.id})}">View order</a></article></section><section th:if="${orders.isEmpty()}" class="empty-state large-empty"><span aria-hidden="true">🍽️</span><h2>No orders yet.</h2><p>Your completed orders will appear here.</p><a class="button" th:href="@{/products}">Browse food</a></section></main></div></body></html>
