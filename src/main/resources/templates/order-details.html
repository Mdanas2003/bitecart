<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Order details | BiteCart</title><link rel="stylesheet" th:href="@{/css/catalog.css}"></head>
<body><div class="page-shell"><header th:replace="~{fragments/catalog :: header}"></header><main class="cart-layout"><a class="back-link" th:href="@{/orders}">← Your orders</a><div class="section-heading"><div><p class="eyebrow">ORDER DETAILS</p><h1 th:text="|Order #${order.id}|">Order</h1></div><strong th:text="${order.orderStatus}">PLACED</strong></div><section class="cart-content"><div class="cart-items"><article th:each="item : ${order.items}" class="cart-item"><div class="cart-item-copy"><h2 th:text="${item.productName}">Item</h2><p th:text="|Quantity: ${item.quantity}|">Quantity</p></div><strong th:text="|₹${item.subtotal}|">₹0</strong></article></div><aside class="cart-summary"><p class="eyebrow">PAYMENT SUMMARY</p><div><span>Subtotal</span><span th:text="|₹${order.subtotal}|">₹0</span></div><div><span>Discount</span><span th:text="|−₹${order.discountAmount}|">₹0</span></div><div><span>Delivery</span><span th:text="|₹${order.deliveryFee}|">₹0</span></div><div class="subtotal"><span>Total</span><strong th:text="|₹${order.totalAmount}|">₹0</strong></div><p th:text="|Payment: ${order.paymentMethod} (${order.paymentStatus})|">Payment</p></aside></section></main></div></body></html>
