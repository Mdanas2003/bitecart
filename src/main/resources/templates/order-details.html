<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Order details | BiteCart</title><link rel="stylesheet" th:href="@{/css/catalog.css}"><link rel="stylesheet" th:href="@{/css/checkout.css}"></head>
<body><div class="page-shell"><header th:replace="~{fragments/catalog :: header}"></header><main class="orders-layout">
<a class="back-link" th:href="@{/orders}">← Your orders</a>
<p class="alert success" th:if="${paymentSuccess}" th:text="${paymentSuccess}"></p><p class="alert" th:if="${paymentError}" th:text="${paymentError}"></p><div class="section-heading"><div><p class="eyebrow">ORDER DETAILS</p><h1 th:text="|Order #${order.id}|">Order</h1><p th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, hh:mm a')}">Date</p></div><span class="status-pill" th:text="${#strings.replace(order.orderStatus, '_', ' ')}">PLACED</span></div>
<section class="order-detail-grid"><div class="checkout-panel"><h2>Items</h2><div class="cart-items"><article th:each="item : ${order.items}" class="cart-item"><div class="cart-item-copy"><h3 class="order-item-name" th:text="${item.productName}">Item</h3><p th:text="|₹${item.price} × ${item.quantity}|">Price</p></div><strong th:text="|₹${item.subtotal}|">₹0</strong></article></div></div>
<aside class="cart-summary"><p class="eyebrow">PAYMENT SUMMARY</p><div class="summary-row"><span>Subtotal</span><span th:text="|₹${order.subtotal}|">₹0</span></div><div class="summary-row discount"><span>Discount</span><span th:text="|−₹${order.discountAmount}|">₹0</span></div><div class="summary-row"><span>Delivery fee</span><span th:text="|₹${order.deliveryFee}|">₹0</span></div><div class="summary-row total"><span>Final total</span><strong th:text="|₹${order.totalAmount}|">₹0</strong></div><a class="secondary-button" th:href="@{/orders/{id}/tracking(id=${order.id})}">Track this order</a><a class="button" th:if="${order.paymentMethod.name() == 'ONLINE' and order.paymentStatus.name() == 'PENDING'}" th:href="@{/orders/{id}/payment(id=${order.id})}">Complete payment</a><p class="mock-note" th:text="|Payment: ${#strings.replace(order.paymentMethod, '_', ' ')} (${order.paymentStatus})|">Payment</p></aside></section>
</main></div></body></html>
