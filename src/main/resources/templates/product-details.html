<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="|${product.name} | BiteCart|">Product | BiteCart</title><link rel="stylesheet" th:href="@{/css/catalog.css}"></head>
<body><div class="page-shell"><header th:replace="~{fragments/catalog :: header}"></header><main class="details-layout"><a class="back-link" th:href="@{/products}">← Back to menu</a><section class="product-details"><div class="detail-image"><img th:if="${product.imageUrl}" th:src="${product.imageUrl}" th:alt="${product.name}"><span th:unless="${product.imageUrl}" aria-hidden="true">🍽️</span></div><div><p class="eyebrow" th:text="${product.categoryName}">Category</p><h1 th:text="${product.name}">Product</h1><div class="product-meta"><span th:text="|★ ${product.rating}|">★ 0</span><span th:if="${product.featured}" class="featured-tag">Featured pick</span></div><p class="detail-description" th:text="${product.description}">Description</p><div class="detail-price"><strong th:text="|₹${product.currentPrice()}|">₹0</strong><del th:if="${product.hasDiscount()}" th:text="|₹${product.price()}|">₹0</del></div><p class="stock" th:text="${product.stockQuantity > 0 ? product.stockQuantity + ' available today' : 'Currently unavailable'}">Availability</p></div></section><section class="content-section" th:if="${not #lists.isEmpty(relatedProducts)}"><div class="section-heading"><div><p class="eyebrow">MORE TO TRY</p><h2>From the same kitchen.</h2></div></div><div class="product-grid"><article th:each="related : ${relatedProducts}" th:replace="~{fragments/catalog :: productCard(product=${related})}"></article></div></section></main></div></body></html>
