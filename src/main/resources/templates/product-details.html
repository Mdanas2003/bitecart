<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="|${product.name} | BiteCart|">Product | BiteCart</title><link rel="stylesheet" th:href="@{/css/catalog.css}"></head>
<body><div class="page-shell"><header th:replace="~{fragments/catalog :: header}"></header><main class="details-layout"><a class="back-link" th:href="@{/products}">← Back to menu</a><p class="alert success" th:if="${cartSuccess}" th:text="${cartSuccess}"></p><p class="alert" th:if="${cartError}" th:text="${cartError}"></p><p class="alert success" th:if="${wishlistSuccess}" th:text="${wishlistSuccess}"></p><p class="alert" th:if="${wishlistError}" th:text="${wishlistError}"></p><section class="product-details"><div class="detail-image"><img th:if="${product.imageUrl}" th:src="${product.imageUrl}" th:alt="${product.name}"><span th:unless="${product.imageUrl}" aria-hidden="true">🍽️</span></div><div><p class="eyebrow" th:text="${product.categoryName}">Category</p><h1 th:text="${product.name}">Product</h1><div class="product-meta"><span th:text="|★ ${product.rating}|">★ 0</span><span th:if="${product.featured}" class="featured-tag">Featured pick</span></div><p class="detail-description" th:text="${product.description}">Description</p><div class="detail-price"><strong th:text="|₹${product.currentPrice()}|">₹0</strong><del th:if="${product.hasDiscount()}" th:text="|₹${product.price()}|">₹0</del></div><p class="stock" th:text="${product.stockQuantity > 0 ? product.stockQuantity + ' available today' : 'Currently unavailable'}">Availability</p><div sec:authorize="isAuthenticated()" class="product-actions"><form th:action="@{/cart/items}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="productId" th:value="${product.id}"><label for="quantity">Quantity</label><input id="quantity" name="quantity" type="number" min="1" th:max="${product.stockQuantity}" value="1" required><button class="button" type="submit" th:disabled="${product.stockQuantity == 0}">Add to cart</button></form><form th:if="${!wishlisted}" th:action="@{/wishlist/items}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="productId" th:value="${product.id}"><button class="secondary-button" type="submit">Save to wishlist</button></form><a th:if="${wishlisted}" class="saved-label" th:href="@{/wishlist}">Saved to wishlist</a></div><p sec:authorize="isAnonymous()" class="sign-in-prompt"><a th:href="@{/login}">Sign in</a> to save items or add them to your cart.</p></div></section><section class="content-section" th:if="${not #lists.isEmpty(relatedProducts)}"><div class="section-heading"><div><p class="eyebrow">MORE TO TRY</p><h2>From the same kitchen.</h2></div></div><div class="product-grid"><article th:each="related : ${relatedProducts}" th:replace="~{fragments/catalog :: productCard(product=${related})}"></article></div></section></main></div></body></html>
