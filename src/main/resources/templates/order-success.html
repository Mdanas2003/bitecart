<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Order placed | BiteCart</title><link rel="stylesheet" th:href="@{/css/catalog.css}"><link rel="stylesheet" th:href="@{/css/checkout.css}"></head>
<body><div class="page-shell"><header th:replace="~{fragments/catalog :: header}"></header><main class="orders-layout"><section class="empty-state large-empty success-card"><span class="success-icon" aria-hidden="true">🎉</span><p class="alert success" th:if="${orderSuccess}" th:text="${orderSuccess}"></p><h1>Order placed!</h1><p th:text="|Order #${order.id} is ${#strings.replace(order.orderStatus, '_', ' ')}.|">Order status</p><p><strong th:text="|₹${order.totalAmount}|">₹0</strong> will be collected using <span th:text="${#strings.replace(order.paymentMethod, '_', ' ')}">payment</span>.</p><div class="success-actions"><a class="button" th:href="@{/orders/{id}(id=${order.id})}">View order details</a><a class="secondary-button" th:href="@{/products}">Keep browsing</a></div></section></main></div></body></html>
