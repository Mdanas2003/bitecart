<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Order placed | BiteCart</title><link rel="stylesheet" th:href="@{/css/catalog.css}"></head>
<body><div class="page-shell"><header th:replace="~{fragments/catalog :: header}"></header><main class="cart-layout"><section class="empty-state large-empty"><span aria-hidden="true">🎉</span><p class="alert success" th:if="${orderSuccess}" th:text="${orderSuccess}"></p><h1>Order placed!</h1><p th:text="|Order #${order.id} is ${order.orderStatus}.|">Order status</p><p th:text="|Total: ₹${order.totalAmount}|">Total</p><a class="button" th:href="@{/orders/{id}(id=${order.id})}">View order details</a></section></main></div></body></html>
