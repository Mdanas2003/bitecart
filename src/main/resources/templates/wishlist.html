<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Your wishlist | BiteCart</title><link rel="stylesheet" th:href="@{/css/catalog.css}"></head>
<body><div class="page-shell"><header th:replace="~{fragments/catalog :: header}"></header><main class="cart-layout"><div class="section-heading"><div><p class="eyebrow">YOUR WISHLIST</p><h1>Saved for later.</h1></div><a th:href="@{/products}">Discover more →</a></div><p class="alert success" th:if="${wishlistSuccess}" th:text="${wishlistSuccess}"></p><p class="alert" th:if="${wishlistError}" th:text="${wishlistError}"></p><section th:if="${!wishlist.items.isEmpty()}" class="wishlist-grid"><article th:each="item : ${wishlist.items}" class="wishlist-item"><a th:href="@{/products/{id}(id=${item.productId})}" class="product-image"><img th:if="${item.imageUrl}" th:src="${item.imageUrl}" th:alt="${item.productName}"><span th:unless="${item.imageUrl}" aria-hidden="true">🍽️</span></a><div><h2 th:text="${item.productName}">Product</h2><p th:text="${item.categoryName}">Category</p><strong th:text="|₹${item.discountPrice != null ? item.discountPrice : item.price}|">₹0</strong><p class="unavailable" th:if="${!item.active}">Currently unavailable</p><form th:action="@{/wishlist/items/{id}/remove(id=${item.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="text-button" type="submit">Remove</button></form></div></article></section><section th:if="${wishlist.items.isEmpty()}" class="empty-state large-empty"><span aria-hidden="true">♡</span><h2>Your wishlist is empty.</h2><p>Save favorites so they are easy to find later.</p><a class="button" th:href="@{/products}">Explore food</a></section></main></div></body></html>
