<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="site-header">
    <a class="brand" th:href="@{/}">BITE <span>CART</span></a>
    <nav aria-label="Primary navigation">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/products}">Browse food</a>
        <a sec:authorize="isAnonymous()" th:href="@{/login}">Sign in</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/wishlist}">Wishlist</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/cart}">Cart</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/orders}">Orders</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">Sign out</button>
        </form>
    </nav>
</header>

<article th:fragment="productCard(product)" th:if="${product != null}" class="product-card">
    <a class="product-image" th:href="@{/products/{id}(id=${product.id})}">
        <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" th:alt="${product.name}">
        <span th:unless="${product.imageUrl}" aria-hidden="true">🍽️</span>
    </a>
    <div class="product-copy">
        <p class="eyebrow" th:text="${product.categoryName}">Category</p>
        <h3><a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}">Product</a></h3>
        <p class="card-description" th:text="${product.description}">Description</p>
        <div class="product-meta"><span th:text="|★ ${product.rating}|">★ 0</span><span th:if="${product.featured}" class="featured-tag">Featured</span></div>
        <div class="price-row"><strong th:text="|₹${product.currentPrice()}|">₹0</strong><del th:if="${product.hasDiscount()}" th:text="|₹${product.price()}|">₹0</del></div>
    </div>
</article>
</body>
</html>
