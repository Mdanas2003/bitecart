<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="${formTitle + ' | BiteCart'}">Delivery address | BiteCart</title><link rel="stylesheet" th:href="@{/css/catalog.css}"><link rel="stylesheet" th:href="@{/css/checkout.css}"></head>
<body><div class="page-shell"><header th:replace="~{fragments/catalog :: header}"></header>
<main class="cart-layout"><div class="section-heading"><div><p class="eyebrow">DELIVERY DETAILS</p><h1 th:text="${formTitle}">Add delivery address</h1></div><a th:href="${returnToCheckout} ? @{/checkout} : @{/addresses}">Cancel</a></div>
<section class="checkout-panel address-form-panel"><p class="address-recipient">Your BiteCart account name is used as the delivery recipient.</p><form th:action="${addressId != null} ? @{/addresses/{id}(id=${addressId})} : @{/addresses}" th:object="${addressForm}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input th:if="${addressId == null}" type="hidden" name="returnToCheckout" th:value="${returnToCheckout}">
<div class="address-form-grid"><label>Address line 1<input th:field="*{addressLine1}" autocomplete="address-line1" required><small th:errors="*{addressLine1}"></small></label><label>Address line 2 <span>(optional)</span><input th:field="*{addressLine2}" autocomplete="address-line2"><small th:errors="*{addressLine2}"></small></label><label>City<input th:field="*{city}" autocomplete="address-level2" required><small th:errors="*{city}"></small></label><label>State<input th:field="*{state}" autocomplete="address-level1" required><small th:errors="*{state}"></small></label><label>Pincode<input th:field="*{postalCode}" inputmode="numeric" autocomplete="postal-code" required><small th:errors="*{postalCode}"></small></label><label>Country<input th:field="*{country}" autocomplete="country-name" required><small th:errors="*{country}"></small></label><label>Phone<input th:field="*{phone}" inputmode="tel" autocomplete="tel" required><small th:errors="*{phone}"></small></label></div><label class="default-check"><input type="checkbox" th:field="*{defaultAddress}"> Make this my default delivery address</label><button class="button" type="submit">Save address</button></form></section>
</main><footer th:replace="~{fragments/catalog :: footer}"></footer></div></body></html>
