<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Browse food | BiteCart</title><link rel="stylesheet" th:href="@{/css/catalog.css}"></head>
<body><div class="page-shell"><header th:replace="~{fragments/catalog :: header}"></header><main class="catalog-layout">
    <section class="catalog-intro"><p class="eyebrow">THE BITE CART MENU</p><h1>Find your next favorite.</h1><p>Filter, browse, and follow your cravings.</p></section>
    <p class="alert" th:if="${catalogError}" th:text="${catalogError}"></p>
    <form class="filters" th:action="@{/products}" method="get">
        <label class="search-field"><span class="sr-only">Search products</span><input name="search" type="search" placeholder="Search burgers, bowls, desserts…" th:value="${filter.search}"></label>
        <select name="categoryId" aria-label="Category"><option value="">All categories</option><option th:each="category : ${categories}" th:value="${category.id}" th:selected="${filter.categoryId == category.id}" th:text="${category.name}"></option></select>
        <input name="minPrice" type="number" min="0" step="0.01" placeholder="Min price" th:value="${filter.minPrice}"><input name="maxPrice" type="number" min="0" step="0.01" placeholder="Max price" th:value="${filter.maxPrice}">
        <select name="minRating" aria-label="Minimum rating"><option value="">Any rating</option><option value="4" th:selected="${filter.minRating != null and filter.minRating.intValue() == 4}">4★ & up</option><option value="3" th:selected="${filter.minRating != null and filter.minRating.intValue() == 3}">3★ & up</option></select>
        <select name="sort" aria-label="Sort products"><option th:each="option : ${sortOptions}" th:value="${option.parameterValue}" th:selected="${filter.sort == option}" th:text="${option.parameterValue == 'newest' ? 'Newest' : option.parameterValue}"></option></select>
        <button class="button" type="submit">Apply</button>
    </form>
    <div class="results-bar"><p th:text="|${products.totalElements} delicious finds|">0 delicious finds</p><a th:href="@{/products}" th:if="${filter.search != null or filter.categoryId != null or filter.minPrice != null or filter.maxPrice != null or filter.minRating != null or filter.sort.parameterValue != 'newest'}">Clear filters</a></div>
    <div class="product-grid"><article th:each="product : ${products.content}" th:replace="~{fragments/catalog :: productCard(product=${product})}"></article></div>
    <p class="empty-state" th:if="${products.empty}">No bites match those filters. Try a broader search.</p>
    <nav class="pagination" th:if="${products.totalPages > 1}" aria-label="Catalog pages"><a th:if="${products.hasPrevious()}" th:href="@{/products(page=${products.number - 1},search=${filter.search},categoryId=${filter.categoryId},minPrice=${filter.minPrice},maxPrice=${filter.maxPrice},minRating=${filter.minRating},sort=${filter.sort.parameterValue})}">← Previous</a><span th:text="|Page ${products.number + 1} of ${products.totalPages}|">Page 1 of 1</span><a th:if="${products.hasNext()}" th:href="@{/products(page=${products.number + 1},search=${filter.search},categoryId=${filter.categoryId},minPrice=${filter.minPrice},maxPrice=${filter.maxPrice},minRating=${filter.minRating},sort=${filter.sort.parameterValue})}">Next →</a></nav>
</main><footer th:replace="~{fragments/catalog :: footer}"></footer></div></body></html>
