<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${title}">Coupon</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><div class="admin-shell"><header th:replace="~{admin/fragments :: header}"></header><main><div class="admin-title"><h1 th:text="${title}"></h1></div><form class="admin-form" th:action="@{/admin/coupons}" th:object="${form}" method="post"><input type="hidden" name="id" th:value="${couponId}"><label>Code<input th:field="*{code}" required></label><label>Description<textarea th:field="*{description}"></textarea></label><label>Discount type<select th:field="*{discountType}" required><option value="">Select</option><option th:each="type:${types}" th:value="${type}" th:text="${type}"></option></select></label><label>Discount value<input type="number" step="0.01" th:field="*{discountValue}" required></label><label>Minimum order<input type="number" step="0.01" th:field="*{minimumOrderAmount}" required></label><label>Maximum discount<input type="number" step="0.01" th:field="*{maximumDiscount}"></label><label>Expiry date<input type="datetime-local" th:field="*{expiryDate}" required></label><label>Usage limit <input type="number" min="1" th:field="*{usageLimit}"></label><label><input type="checkbox" th:field="*{active}"> Active</label><button class="button">Save coupon</button></form></main></div></body></html>
