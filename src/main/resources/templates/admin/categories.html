<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Categories | Admin</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><div class="admin-shell"><header th:replace="~{admin/fragments :: header}"></header><main><div class="admin-title"><h1>Categories</h1><a class="button" th:href="@{/admin/categories/new}">Add category</a></div><div th:replace="~{admin/fragments :: messages}"></div><section class="admin-card"><table class="admin-table"><tr><th>Name</th><th>Description</th><th>Active</th><th></th></tr><tr th:each="category:${categories}"><td th:text="${category.name}"></td><td th:text="${category.description}"></td><td th:text="${category.active}"></td><td><a class="button-secondary" th:href="@{/admin/categories/{id}/edit(id=${category.id})}">Edit</a><form class="inline-form" th:action="@{/admin/categories/{id}/delete(id=${category.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button-danger">Delete</button></form></td></tr></table></section></main></div></body></html>
