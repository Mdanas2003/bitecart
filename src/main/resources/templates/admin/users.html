<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users | Admin</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><div class="admin-shell"><header th:replace="~{admin/fragments :: header}"></header><main><div class="admin-title"><h1>Users</h1></div><div th:replace="~{admin/fragments :: messages}"></div><section class="admin-card"><table class="admin-table"><tr><th>Name</th><th>Email</th><th>Phone</th><th>Access</th><th></th></tr><tr th:each="user:${users}"><td th:text="|${user.firstName} ${user.lastName}|"></td><td th:text="${user.email}"></td><td th:text="${user.phone}"></td><td><form th:action="@{/admin/users/{id}(id=${user.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select name="role"><option th:each="role:${roles}" th:value="${role}" th:selected="${role == user.role}" th:text="${role}"></option></select><label><input type="checkbox" name="enabled" value="true" th:checked="${user.enabled}"> Enabled</label><button class="button-secondary">Update</button></form></td><td><span class="status" th:text="${user.role}"></span></td></tr></table></section></main></div></body></html>
