<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order | Admin</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><div class="admin-shell"><header th:replace="~{admin/fragments :: header}"></header><main><div class="admin-title"><h1 th:text="|Order #${order.id}|"></h1><a class="button-secondary" th:href="@{/admin/orders}">Back</a></div><div th:replace="~{admin/fragments :: messages}"></div><section class="admin-card"><p><strong>Status:</strong> <span th:text="${order.orderStatus}"></span></p><form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select name="status"><option th:each="status:${statuses}" th:value="${status}" th:selected="${status == order.orderStatus}" th:text="${status}"></option></select><button class="button">Update status</button></form><h2>Items</h2><table class="admin-table"><tr><th>Product</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr><tr th:each="item:${order.items}"><td th:text="${item.productName}"></td><td th:text="${item.quantity}"></td><td th:text="|₹${item.price}|"></td><td th:text="|₹${item.subtotal}|"></td></tr></table><p><strong>Total:</strong> <span th:text="|₹${order.totalAmount}|"></span></p></section></main></div></body></html>
