<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${title}">Category</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><div class="admin-shell"><header th:replace="~{admin/fragments :: header}"></header><main><div class="admin-title"><h1 th:text="${title}"></h1></div><form class="admin-form" th:action="@{/admin/categories}" th:object="${form}" method="post"><input type="hidden" name="id" th:value="${categoryId}"><label>Name<input th:field="*{name}" required></label><label>Description<textarea th:field="*{description}"></textarea></label><label>Image URL<input th:field="*{imageUrl}"></label><label><input type="checkbox" th:field="*{active}"> Active</label><button class="button">Save category</button></form></main></div></body></html>
