<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reviews | Admin</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><div class="admin-shell"><header th:replace="~{admin/fragments :: header}"></header><main><div class="admin-title"><h1>Reviews</h1></div><div th:replace="~{admin/fragments :: messages}"></div><section class="admin-card"><table class="admin-table"><tr><th>Customer</th><th>Product</th><th>Order</th><th>Rating</th><th>Comment</th><th></th></tr><tr th:each="review:${reviews}"><td th:text="${review.reviewerName}"></td><td th:text="${review.productId}"></td><td th:text="${review.orderId}"></td><td th:text="|★ ${review.rating}|"></td><td class="review-comment" th:text="${review.comment}"></td><td><form th:action="@{/admin/reviews/{id}/delete(id=${review.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button-danger">Remove</button></form></td></tr></table></section></main></div></body></html>
