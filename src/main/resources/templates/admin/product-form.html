<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${title}">Product</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><div class="admin-shell"><header th:replace="~{admin/fragments :: header}"></header><main><div class="admin-title"><h1 th:text="${title}">Product</h1></div><form class="admin-form" th:action="@{/admin/products}" th:object="${form}" method="post"><input type="hidden" name="id" th:value="${productId}"><label>Name<input th:field="*{name}" required></label><label>Description<textarea th:field="*{description}"></textarea></label><label>Category<select th:field="*{categoryId}" required><option value="">Select</option><option th:each="category:${categories}" th:value="${category.id}" th:text="${category.name}"></option></select></label><label>Price<input type="number" step="0.01" th:field="*{price}" required></label><label>Discount price<input type="number" step="0.01" th:field="*{discountPrice}"></label><label>Image URL<input th:field="*{imageUrl}"></label><label>Stock quantity<input type="number" min="0" th:field="*{stockQuantity}" required></label><div class="checks"><label><input type="checkbox" th:field="*{featured}"> Featured</label><label><input type="checkbox" th:field="*{active}"> Active</label></div><button class="button">Save product</button></form></main></div></body></html>
