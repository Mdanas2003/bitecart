<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders | Admin</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><div class="admin-shell"><header th:replace="~{admin/fragments :: header}"></header><main><div class="admin-title"><h1>Orders</h1></div><section class="admin-card"><table class="admin-table"><tr><th>Order</th><th>Created</th><th>Status</th><th>Total</th><th></th></tr><tr th:each="order:${orders}"><td th:text="|#${order.id}|"></td><td th:text="${order.createdAt}"></td><td><span class="status" th:text="${order.orderStatus}"></span></td><td th:text="|₹${order.totalAmount}|"></td><td><a class="button-secondary" th:href="@{/admin/orders/{id}(id=${order.id})}">Manage</a></td></tr></table></section></main></div></body></html>
