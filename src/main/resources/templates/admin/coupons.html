<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coupons | Admin</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><div class="admin-shell"><header th:replace="~{admin/fragments :: header}"></header><main><div class="admin-title"><h1>Coupons</h1><a class="button" th:href="@{/admin/coupons/new}">Add coupon</a></div><div th:replace="~{admin/fragments :: messages}"></div><section class="admin-card"><table class="admin-table"><tr><th>Code</th><th>Discount</th><th>Expiry</th><th>Usage</th><th>Active</th><th></th></tr><tr th:each="coupon:${coupons}"><td th:text="${coupon.code}"></td><td th:text="|${coupon.discountValue} ${coupon.discountType}|"></td><td th:text="${coupon.expiryDate}"></td><td th:text="|${coupon.usedCount}/${coupon.usageLimit ?: '∞'}|"></td><td th:text="${coupon.active}"></td><td><a class="button-secondary" th:href="@{/admin/coupons/{id}/edit(id=${coupon.id})}">Edit</a><form class="inline-form" th:action="@{/admin/coupons/{id}/delete(id=${coupon.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button-danger">Delete</button></form></td></tr></table></section></main></div></body></html>
