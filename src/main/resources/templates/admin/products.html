<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | Admin</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><div class="admin-shell"><header th:replace="~{admin/fragments :: header}"></header><main><div class="admin-title"><h1>Products</h1><a class="button" th:href="@{/admin/products/new}">Add product</a></div><div th:replace="~{admin/fragments :: messages}"></div><section class="admin-card"><table class="admin-table"><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Active</th><th></th></tr><tr th:each="product : ${products}"><td th:text="${product.name}">Product</td><td th:text="${product.categoryName}">Category</td><td th:text="|₹${product.price}|">0</td><td th:text="${product.stockQuantity}">0</td><td th:text="${product.active}">true</td><td><a class="button-secondary" th:href="@{/admin/products/{id}/edit(id=${product.id})}">Edit</a><form class="inline-form" th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button-danger">Delete</button></form></td></tr></table></section></main></div></body></html>
