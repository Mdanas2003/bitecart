<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout | BiteCart</title><link rel="stylesheet" th:href="@{/css/catalog.css}"></head>
<body><div class="page-shell"><header th:replace="~{fragments/catalog :: header}"></header>
<main class="cart-layout"><div class="section-heading"><div><p class="eyebrow">CHECKOUT</p><h1>One cart away.</h1></div><a th:href="@{/cart}">← Back to cart</a></div>
<p class="alert success" th:if="${checkoutSuccess}" th:text="${checkoutSuccess}"></p><p class="alert" th:if="${checkoutError}" th:text="${checkoutError}"></p>
<section class="cart-content"><div class="cart-items"><form th:action="@{/checkout/order}" th:object="${checkoutForm}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<fieldset><legend>Delivery address</legend><p th:if="${addresses.isEmpty()}" class="alert">No delivery address is available for your account.</p><div th:each="address : ${addresses}"><label><input type="radio" th:field="*{addressId}" th:value="${address.id}" required><span th:text="|${address.addressLine1}, ${address.city}, ${address.state} ${address.postalCode}|">Address</span><span th:if="${address.defaultAddress}"> (Default)</span></label></div></fieldset>
<fieldset><legend>Payment method</legend><label><input type="radio" th:field="*{paymentMethod}" value="CASH_ON_DELIVERY" required> Cash on delivery</label><label><input type="radio" th:field="*{paymentMethod}" value="ONLINE" required> Online (mock payment)</label></fieldset>
<button class="button" type="submit" th:disabled="${addresses.isEmpty()}">Place order</button></form>
<section><h2>Coupon</h2><div th:if="${couponCode}"><p>Applied: <strong th:text="${couponCode}">CODE</strong> — <span th:text="|−₹${couponDiscount}|">−₹0</span></p><form th:action="@{/checkout/coupon/remove}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="text-button" type="submit">Remove coupon</button></form></div><form th:unless="${couponCode}" th:action="@{/checkout/coupon}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label for="code">Coupon code</label><input id="code" name="code" maxlength="50" required><button class="secondary-button" type="submit">Apply</button></form></section></div>
<aside class="cart-summary"><p class="eyebrow">ORDER SUMMARY</p><div th:each="item : ${cart.items}"><span th:text="|${item.productName} × ${item.quantity}|">Item</span><span th:text="|₹${item.lineTotal}|">₹0</span></div><div><span>Subtotal</span><strong th:text="|₹${cart.subtotal}|">₹0</strong></div><div th:if="${couponCode}"><span>Discount</span><strong th:text="|−₹${couponDiscount}|">₹0</strong></div><div class="subtotal"><span>Total</span><strong th:text="|₹${cart.subtotal - couponDiscount}|">₹0</strong></div></aside></section></main></div></body></html>
